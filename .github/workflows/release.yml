name: Build and Release APKs

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (ex: v3.6.3)'
        required: false
        default: 'v3.6.3'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release and Debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/tessera-browser-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/tessera-browser-debug.apk
          ls -la dist/

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            dist/tessera-browser-release.apk
            dist/tessera-browser-debug.apk
